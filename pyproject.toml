[project]
name = "hakata-gym-crowding"
version = "0.1.0"
description = "博多体育館トレーニング室の混雑状況を定期取得する RPA"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gspread>=6.2.1",
    "google-auth>=2.40.0",
    "httpx>=0.28.1",
    "jpholiday>=1.0.2",
    "playwright>=1.62.0",
    "python-dotenv>=1.1.1",
    "tzdata>=2025.2",
]

[project.scripts]
hakata-crowding = "hakata_gym_crowding.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hakata_gym_crowding"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
