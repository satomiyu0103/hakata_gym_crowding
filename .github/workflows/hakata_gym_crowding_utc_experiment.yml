# schedule 未発火の切り分け用（UTC 明示・timezone なし）
# 仮説: timezone が効かず本番 cron が UTC 解釈されている場合、本ファイルは JST 9:00–21:30 に発火するはず。
# 本番 hakata_gym_crowding.yml と並行可。常に --dry-run（Sheets 追記なし）。
# 判定後は本ファイルを削除するか、schedule をコメントアウトして無効化する。
name: Hakata Gym Crowding UTC Experiment

on:
  workflow_dispatch: {}
  schedule:
    # JST 9:00–21:30 = UTC 0:00–12:30（timezone フィールドは付けない）
    - cron: "0,30 0-12 * * *"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log trigger context
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "utc_now=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Configure secrets
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          mkdir -p config logs
          umask 077
          printf '%s' "$GOOGLE_SHEETS_CREDENTIALS" > config/service-account.json
          {
            echo "SPREADSHEET_ID=${SPREADSHEET_ID}"
            echo "GOOGLE_APPLICATION_CREDENTIALS=config/service-account.json"
            echo "TIMEZONE=Asia/Tokyo"
            echo "SHEET_NAME=混雑履歴"
            echo "SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}"
            echo "SLACK_NOTIFY_ENABLED=false"
          } > config/.env

      - name: Run crowding fetch (dry-run)
        run: uv run python -m hakata_gym_crowding.cli --dry-run --force

      - name: Upload run log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-utc-experiment
          path: logs/run.log
          if-no-files-found: ignore
