<!-- 天気ブロック抜粋（テスト用フィクスチャ） -->
<div class="new_weather">
	<div class="theDayWap clearfix">
		<div class="visualWap">
			<div class="todayIcon">
				<img src="https://ssk-hakata-gym.com/img/weather_icon/04d.png" alt="天気アイコン" width="75" height="">
			</div>
		</div>
		<div class="todayInfo floatL">
			<div class="infLine clearfix">
				<div class="infT bold floatL max">最高</div>
				<div class="infD floatL"><span class="bold max">29</span>&nbsp;℃</div>
			</div>
			<div class="infLine clearfix">
				<div class="infT bold floatL min">最低</div>
				<div class="infD floatL"><span class="bold min">28</span>&nbsp;℃</div>
			</div>
			<div class="infLine clearfix">
				<div class="infT bold floatL wind">風速</div>
				<div class="infD floatL"><span class="bold wind">5</span>&nbsp;m</div>
			</div>
			<div class="infLine clearfix">
				<div class="infT bold floatL dig">風向</div>
				<div class="infD floatL"><span class="bold dig">東</span></div>
			</div>
			<div class="infLine clearfix">
				<div class="infT bold floatL desc">降水</div>
				<div class="infD floatL"><span class="bold desc">20</span>&nbsp;%</div>
			</div>
		</div>
	</div>
</div>
